name: Deploy Book HTML Release to GitHub Pages

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布到 GitHub Pages 的电子书 Release Tag（留空自动取最新 book-v*）"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "book-pages"
  cancel-in-progress: false

jobs:
  build-from-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'book-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target book release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="$(gh release list -R "${{ github.repository }}" --limit 30 --json tagName --jq '[.[] | select(.tagName | startswith("book-v"))][0].tagName')"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "ERROR: No book-v* release found in ${{ github.repository }}" >&2
            exit 1
          fi
          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Release HTML asset, verify SHA-256, and assemble Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 book/scripts/build_pages.py \
            --from-release "${{ steps.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --out-dir book/_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_site

  deploy:
    needs: build-from-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
