<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430">
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="a8b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="a8r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
  </defs>
  <rect width="920" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="460" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a"
        font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">图 4-2 现代大模型三大招牌算子：RoPE 旋转位置编码 · SwiGLU 门控网络 · RMSNorm</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#64748b"
        font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">为什么 Qwen3 / LLaMA-3 / DeepSeek 不约而同地放弃了 2017 年的旧组件，全部转向这三大核心算子？</text>

  <!-- Card 1: RoPE -->
  <rect x="26" y="72" width="286" height="338" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="26" y="72" width="286" height="34" rx="10" fill="#dbeafe"/>
  <text x="169" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a" font-family="'PingFang SC',sans-serif">
    ① RoPE 旋转位置编码
  </text>

  <!-- 2D Rotation coordinate circle -->
  <circle cx="169" cy="202" r="72" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="84" y1="202" x2="254" y2="202" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="169" y1="286" x2="169" y2="118" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Vector q at angle m*theta -->
  <line x1="169" y1="202" x2="228" y2="166" stroke="#2563eb" stroke-width="2.6" marker-end="url(#a8b)"/>
  <text x="234" y="160" font-size="11.5" font-weight="700" fill="#1d4ed8" font-family="'SF Mono',sans-serif">qₘ (角度 mθ)</text>
  <!-- Vector k at angle n*theta -->
  <line x1="169" y1="202" x2="128" y2="146" stroke="#e11d48" stroke-width="2.6" marker-end="url(#a8r)"/>
  <text x="72" y="138" font-size="11.5" font-weight="700" fill="#be123c" font-family="'SF Mono',sans-serif">kₙ (角度 nθ)</text>
  <!-- Angle arc -->
  <path d="M 196 186 A 32 32 0 0 0 150 176" fill="none" stroke="#d97706" stroke-width="2.2"/>
  <text x="172" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309" font-family="'SF Mono',sans-serif">(n-m)θ</text>

  <text x="42" y="308" font-size="11.5" font-weight="700" fill="#0f172a" font-family="'PingFang SC',sans-serif">核心魔力（高中余弦定理）：</text>
  <text x="42" y="328" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">· 每两维配对成一个“时钟指针”旋转</text>
  <text x="42" y="346" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">· qₘ·kₙ 的夹角只取决于相对距离 (m−n)</text>
  <text x="42" y="364" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">· 不改变向量模长，外推长音频/长文本稳</text>
  <text x="42" y="388" font-size="11" font-weight="700" fill="#1d4ed8" font-family="'SF Mono',monospace">Qwen3: rope_theta = 1,000,000</text>

  <!-- Card 2: SwiGLU -->
  <rect x="326" y="72" width="290" height="338" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
  <rect x="326" y="72" width="290" height="34" rx="10" fill="#ccfbf1"/>
  <text x="471" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#134e4a" font-family="'PingFang SC',sans-serif">
    ② SwiGLU 门控前馈网络 (MLP)
  </text>

  <g font-family="'PingFang SC','SF Mono',sans-serif" font-size="11.5" text-anchor="middle">
    <rect x="411" y="122" width="120" height="30" rx="6" fill="#f1f5f9" stroke="#64748b"/>
    <text x="471" y="141" font-weight="700" fill="#0f172a">输入 x (1024)</text>

    <path d="M 441 152 L 401 180" stroke="#475569" stroke-width="1.8" marker-end="url(#a8)"/>
    <path d="M 501 152 L 541 180" stroke="#475569" stroke-width="1.8" marker-end="url(#a8)"/>

    <rect x="342" y="184" width="118" height="44" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="401" y="203" font-weight="700" fill="#92400e">gate_proj (3072)</text>
    <text x="401" y="220" font-size="10.5" fill="#b45309">SiLU 开关阀门</text>

    <rect x="482" y="184" width="118" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="541" y="203" font-weight="700" fill="#1e3a8a">up_proj (3072)</text>
    <text x="541" y="220" font-size="10.5" fill="#1d4ed8">特征升维内容</text>

    <path d="M 401 228 L 453 256" stroke="#475569" stroke-width="1.8" marker-end="url(#a8)"/>
    <path d="M 541 228 L 489 256" stroke="#475569" stroke-width="1.8" marker-end="url(#a8)"/>

    <circle cx="471" cy="268" r="16" fill="#0d9488"/>
    <text x="471" y="274" font-size="16" font-weight="700" fill="#ffffff">⊙</text>
    <text x="538" y="273" font-size="10.5" fill="#0f766e">逐元素相乘</text>

    <line x1="471" y1="284" x2="471" y2="306" stroke="#475569" stroke-width="1.8" marker-end="url(#a8)"/>
    <rect x="386" y="310" width="170" height="32" rx="6" fill="#ecfdf5" stroke="#10b981"/>
    <text x="471" y="330" font-weight="700" fill="#065f46">down_proj (3072 → 1024)</text>
  </g>
  <text x="342" y="366" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">· 3 个矩阵（gate/up/down），无 bias</text>
  <text x="342" y="386" font-size="11" font-weight="600" fill="#0f766e" font-family="'PingFang SC',sans-serif">· 动态开关每个通道，表达力远胜 ReLU</text>

  <!-- Card 3: RMSNorm + QK-Norm -->
  <rect x="630" y="72" width="264" height="338" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="630" y="72" width="264" height="34" rx="10" fill="#ede9fe"/>
  <text x="762" y="94" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4c1d95" font-family="'PingFang SC',sans-serif">
    ③ RMSNorm 与 Qwen3 QK-Norm
  </text>

  <rect x="646" y="122" width="232" height="74" rx="8" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="762" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6" font-family="'PingFang SC',sans-serif">LayerNorm (旧) vs RMSNorm (新)</text>
  <text x="658" y="164" font-size="11" fill="#64748b" font-family="'PingFang SC',sans-serif">· LayerNorm：减均值 + 除标准差 + γ, β</text>
  <text x="658" y="184" font-size="11" font-weight="700" fill="#5b21b6" font-family="'PingFang SC',sans-serif">· RMSNorm：省掉减均值！只除均方根 × γ</text>

  <rect x="646" y="210" width="232" height="82" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="762" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e" font-family="'PingFang SC',sans-serif">为什么要“省那一下减均值”？</text>
  <text x="658" y="250" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">1. 少一次全局归约，融合 Kernel 提速 15%+</text>
  <text x="658" y="268" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">2. 去掉 β 参数，效果几乎 100% 等价</text>
  <text x="658" y="284" font-size="11" fill="#b45309" font-family="'PingFang SC',sans-serif">3. Qwen3 解码器全部用 RMSNorm</text>

  <rect x="646" y="306" width="232" height="88" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="762" y="326" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46" font-family="'PingFang SC',sans-serif">Qwen3 绝活：Per-Head QK-Norm</text>
  <text x="658" y="346" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">在算 RoPE 前，对每个 Head(128维) 的</text>
  <text x="658" y="364" font-size="11" fill="#334155" font-family="'PingFang SC',sans-serif">Q 和 K 各自做一次 RMSNorm，彻底锁死</text>
  <text x="658" y="382" font-size="11" font-weight="700" fill="#047857" font-family="'PingFang SC',sans-serif">Attention Logits 爆炸，长训练稳如泰山！</text>
</svg>
