<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect width="920" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="460" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a"
        font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">图 2-1 PyTorch Tensor 底层内存真相：同一块一维 Storage 上的两个“零拷贝视图”</text>
  <text x="460" y="53" text-anchor="middle" font-size="12" fill="#64748b"
        font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">为什么 x.transpose(0, 1) 瞬间完成且不占显存，但后面直接 .view() 会报错？答案全在 Stride 里</text>

  <!-- Tensor A header -->
  <rect x="34" y="76" width="390" height="128" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="52" y="102" font-size="13.5" font-weight="700" fill="#1d4ed8" font-family="'SF Mono','PingFang SC',sans-serif">张量 A = torch.arange(6).view(2, 3)</text>
  <text x="52" y="124" font-size="12" fill="#1e293b" font-family="'SF Mono','PingFang SC',sans-serif">shape=(2, 3)   stride=(3, 1)   offset=0   contiguous=True</text>
  <!-- 2x3 matrix visual -->
  <g font-family="'SF Mono',monospace" font-size="13" text-anchor="middle">
    <rect x="60" y="138" width="54" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="87" y="156" fill="#0f172a">0</text>
    <rect x="114" y="138" width="54" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="141" y="156" fill="#0f172a">1</text>
    <rect x="168" y="138" width="54" height="26" fill="#dbeafe" stroke="#3b82f6"/><text x="195" y="156" fill="#0f172a">2</text>
    <rect x="60" y="164" width="54" height="26" fill="#bfdbfe" stroke="#3b82f6"/><text x="87" y="182" fill="#0f172a">3</text>
    <rect x="114" y="164" width="54" height="26" fill="#bfdbfe" stroke="#3b82f6"/><text x="141" y="182" fill="#0f172a">4</text>
    <rect x="168" y="164" width="54" height="26" fill="#bfdbfe" stroke="#3b82f6"/><text x="195" y="182" fill="#0f172a">5</text>
  </g>
  <text x="236" y="155" font-size="11.5" fill="#1e40af" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">找 A[r, c] 的物理地址：</text>
  <text x="236" y="176" font-size="12" font-weight="700" fill="#1e3a8a" font-family="'SF Mono',monospace">idx = 0 + r*3 + c*1</text>
  <text x="236" y="194" font-size="11" fill="#475569" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">下一行跳 3 格，下一列跳 1 格</text>

  <!-- Tensor B header -->
  <rect x="496" y="76" width="390" height="128" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="514" y="102" font-size="13.5" font-weight="700" fill="#b45309" font-family="'SF Mono','PingFang SC',sans-serif">张量 B = A.transpose(0, 1)  (零拷贝!)</text>
  <text x="514" y="124" font-size="12" fill="#1e293b" font-family="'SF Mono','PingFang SC',sans-serif">shape=(3, 2)   stride=(1, 3)   offset=0   contiguous=False</text>
  <!-- 3x2 matrix visual -->
  <g font-family="'SF Mono',monospace" font-size="12.5" text-anchor="middle">
    <rect x="522" y="135" width="48" height="21" fill="#fef3c7" stroke="#d97706"/><text x="546" y="150" fill="#0f172a">0</text>
    <rect x="570" y="135" width="48" height="21" fill="#fde68a" stroke="#d97706"/><text x="594" y="150" fill="#0f172a">3</text>
    <rect x="522" y="156" width="48" height="21" fill="#fef3c7" stroke="#d97706"/><text x="546" y="171" fill="#0f172a">1</text>
    <rect x="570" y="156" width="48" height="21" fill="#fde68a" stroke="#d97706"/><text x="594" y="171" fill="#0f172a">4</text>
    <rect x="522" y="177" width="48" height="21" fill="#fef3c7" stroke="#d97706"/><text x="546" y="192" fill="#0f172a">2</text>
    <rect x="570" y="177" width="48" height="21" fill="#fde68a" stroke="#d97706"/><text x="594" y="192" fill="#0f172a">5</text>
  </g>
  <text x="634" y="153" font-size="11.5" fill="#92400e" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">找 B[r, c] 的物理地址：</text>
  <text x="634" y="174" font-size="12" font-weight="700" fill="#78350f" font-family="'SF Mono',monospace">idx = 0 + r*1 + c*3</text>
  <text x="634" y="193" font-size="11" fill="#b45309" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">只互换了 stride，数据没搬家!</text>

  <!-- Pointers to shared Storage -->
  <path d="M 229 204 L 229 246 L 340 246 L 340 272" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#a1)"/>
  <path d="M 691 204 L 691 246 L 580 246 L 580 272" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#a2)"/>
  <text x="460" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">
    共享完全相同的底层一维显存块（UntypedStorage）
  </text>

  <!-- Physical 1D Storage -->
  <rect x="110" y="276" width="700" height="72" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="132" y="298" font-size="12" font-weight="600" fill="#94a3b8" font-family="'SF Mono','PingFang SC',sans-serif">GPU HBM 连续物理地址 (int64, 每个元素占 8 Bytes, 共 48 Bytes)</text>
  <g font-family="'SF Mono',monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="132" y="308" width="106" height="30" rx="4" fill="#1e3a8a" stroke="#60a5fa"/><text x="185" y="328" fill="#ffffff">[0] 0</text>
    <rect x="242" y="308" width="106" height="30" rx="4" fill="#1e3a8a" stroke="#60a5fa"/><text x="295" y="328" fill="#ffffff">[1] 1</text>
    <rect x="352" y="308" width="106" height="30" rx="4" fill="#1e3a8a" stroke="#60a5fa"/><text x="405" y="328" fill="#ffffff">[2] 2</text>
    <rect x="462" y="308" width="106" height="30" rx="4" fill="#0f766e" stroke="#2dd4bf"/><text x="515" y="328" fill="#ffffff">[3] 3</text>
    <rect x="572" y="308" width="106" height="30" rx="4" fill="#0f766e" stroke="#2dd4bf"/><text x="625" y="328" fill="#ffffff">[4] 4</text>
    <rect x="682" y="308" width="106" height="30" rx="4" fill="#0f766e" stroke="#2dd4bf"/><text x="735" y="328" fill="#ffffff">[5] 5</text>
  </g>

  <!-- Takeaway -->
  <rect x="34" y="364" width="852" height="40" rx="8" fill="#fff1f2" stroke="#fb7185"/>
  <text x="460" y="389" text-anchor="middle" font-size="12" font-weight="600" fill="#9f1239"
        font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">
    工程忠告：修改 B[0,1]=99 会同步改变 A[1,0]！若要对非连续张量变形状，用 B.contiguous().view(-1) 或 B.reshape(-1)
  </text>
</svg>
