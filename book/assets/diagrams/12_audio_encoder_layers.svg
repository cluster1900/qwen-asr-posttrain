<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <marker id="a12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0d9488"/>
    </marker>
  </defs>
  <rect width="920" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="460" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a"
        font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">图 7-1 听觉编码器（Audio Encoder）逐层维度演变：一段 4 秒中文语音的奇幻旅程</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#64748b"
        font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">把 64,000 个采样点一路压缩提纯为 50 个高语义 1024 维音频 Token（压缩比 1,280 : 1）</text>

  <!-- Vertical flow left to right in 2 rows -->
  <!-- Row 1: Signal Processing & Conv Stem -->
  <g font-family="'PingFang SC','SF Mono',sans-serif" text-anchor="middle">
    <!-- Box 1 -->
    <rect x="28" y="76" width="146" height="122" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <text x="101" y="98" font-size="12.5" font-weight="700" fill="#134e4a">原始 PCM 声波</text>
    <text x="101" y="118" font-size="11" fill="#334155">4 秒 × 16,000 Hz</text>
    <rect x="42" y="128" width="118" height="24" rx="5" fill="#ccfbf1"/>
    <text x="101" y="144" font-size="11.5" font-weight="700" fill="#0f766e">[64,000]</text>
    <text x="101" y="170" font-size="10.5" fill="#64748b">int16 ÷ 32768</text>
    <text x="101" y="186" font-size="10.5" fill="#64748b">→ float32 [-1, 1]</text>

    <line x1="174" y1="137" x2="202" y2="137" stroke="#0d9488" stroke-width="2" marker-end="url(#a12)"/>

    <!-- Box 2 -->
    <rect x="206" y="76" width="154" height="122" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <text x="283" y="98" font-size="12.5" font-weight="700" fill="#134e4a">Log-Mel 频谱图</text>
    <text x="283" y="118" font-size="11" fill="#334155">窗 25ms, 步长 10ms</text>
    <rect x="220" y="128" width="126" height="24" rx="5" fill="#ccfbf1"/>
    <text x="283" y="144" font-size="11.5" font-weight="700" fill="#0f766e">[1, 128, 400]</text>
    <text x="283" y="170" font-size="10.5" fill="#64748b">128 个梅尔频带</text>
    <text x="283" y="186" font-size="10.5" fill="#64748b">400 帧 (100 Hz)</text>

    <line x1="360" y1="137" x2="388" y2="137" stroke="#0d9488" stroke-width="2" marker-end="url(#a12)"/>

    <!-- Box 3: 3x Conv2d -->
    <rect x="392" y="76" width="234" height="122" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
    <text x="509" y="98" font-size="12.5" font-weight="700" fill="#065f46">3× Conv2d (k=3, s=2, p=1) + GELU</text>
    <text x="509" y="118" font-size="10.5" fill="#047857">conv1: [1,128,400] → [480, 64, 200]</text>
    <text x="509" y="136" font-size="10.5" fill="#047857">conv2: [480,64,200] → [480, 32, 100]</text>
    <text x="509" y="154" font-size="10.5" fill="#047857">conv3: [480,32,100] → [480, 16, 50]</text>
    <text x="509" y="178" font-size="10.5" font-weight="700" fill="#065f46">时间 8×降采样(80ms/帧) · 频率 8×压缩</text>
    <text x="509" y="193" font-size="10" fill="#64748b">参数：4,800 + 2,074,080 + 2,074,080</text>

    <line x1="626" y1="137" x2="654" y2="137" stroke="#0d9488" stroke-width="2" marker-end="url(#a12)"/>

    <!-- Box 4: Flatten + conv_out -->
    <rect x="658" y="76" width="234" height="122" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
    <text x="775" y="98" font-size="12.5" font-weight="700" fill="#134e4a">通道展平 + conv_out + 位置编码</text>
    <text x="775" y="118" font-size="10.5" fill="#334155">把 480 通道 × 16 频带拉平为 7680</text>
    <rect x="678" y="128" width="194" height="24" rx="5" fill="#ccfbf1"/>
    <text x="775" y="144" font-size="11.5" font-weight="700" fill="#0f766e">[50, 7680] → [50, 896]</text>
    <text x="775" y="170" font-size="10.5" fill="#64748b">线性映射无 bias (6,881,280 参数)</text>
    <text x="775" y="186" font-size="10.5" fill="#64748b">+ Sinusoidal 正弦位置编码</text>
  </g>

  <!-- Wrap arrow from Row 1 Box 4 down to Row 2 -->
  <path d="M 775 198 L 775 224 L 180 224 L 180 248" fill="none" stroke="#0d9488" stroke-width="2.2" marker-end="url(#a12)"/>

  <!-- Row 2: 18L AuT + Projector -->
  <g font-family="'PingFang SC','SF Mono',sans-serif" text-anchor="middle">
    <!-- 18L AuT -->
    <rect x="28" y="252" width="440" height="144" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="248" y="276" font-size="13.5" font-weight="700" fill="#1e3a8a">18 层 AuT 双向 Transformer 编码器 (×18)</text>
    <text x="248" y="297" font-size="11" fill="#1e293b">张量形状全程保持 [50, 896]（每帧代表 80ms 声音）</text>
    <rect x="46" y="308" width="192" height="52" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="142" y="328" font-size="11.5" font-weight="700" fill="#1d4ed8">Multi-Head Self-Attention</text>
    <text x="142" y="346" font-size="10.5" fill="#475569">14 头 × 64 维 = 896 (含 bias)</text>
    <rect x="256" y="308" width="194" height="52" rx="6" fill="#ffffff" stroke="#3b82f6"/>
    <text x="353" y="328" font-size="11.5" font-weight="700" fill="#1d4ed8">GELU FFN + 残差 + LN</text>
    <text x="353" y="346" font-size="10.5" fill="#475569">896 → 3584 → 896 (双向看上下文)</text>
    <text x="248" y="382" font-size="11" font-weight="600" fill="#1e40af">作用：融合前后语境，把模糊的噪声/混响声波提炼成清晰音素表征</text>

    <line x1="468" y1="324" x2="504" y2="324" stroke="#0d9488" stroke-width="2.2" marker-end="url(#a12)"/>

    <!-- Projector -->
    <rect x="508" y="252" width="384" height="144" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="700" y="276" font-size="13.5" font-weight="700" fill="#92400e">ln_post + 跨模态投影器 (proj1 → GELU → proj2)</text>
    <text x="700" y="298" font-size="11" fill="#78350f">把“听觉方言 (896 维)”翻译成“Qwen3 普通话 (1024 维)”</text>
    <rect x="530" y="310" width="340" height="44" rx="6" fill="#ffffff" stroke="#f59e0b"/>
    <text x="700" y="329" font-size="11.5" font-weight="700" fill="#b45309">[50, 896] → LN → [50, 896] → GELU → [50, 1024]</text>
    <text x="700" y="346" font-size="10.5" fill="#64748b">1,792 + 803,712 + 918,528 = 1,724,032 参数</text>
    <text x="700" y="380" font-size="11" font-weight="700" fill="#92400e">交付给语言模型：50 个可直接与汉字 Embedding 混排的音频 Token！</text>
  </g>
</svg>
